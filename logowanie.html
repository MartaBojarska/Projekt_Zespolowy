<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - HoneyShop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f4e1;
            color: #3d3d3d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .login-btn {
            background-color: #ff9900;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            width: 100%;
            border-radius: 5px;
        }
        .login-btn:hover {
            background-color: #cc7700;
        }
        .register-link {
            display: block;
            margin-top: 10px;
            color: #0073e6;
            text-decoration: none;
        }
        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Zaloguj się</h2>
        <form action="login.php" method="POST">
            <input type="email" name="email" placeholder="E-mail" required>
            <input type="password" name="password" placeholder="Hasło" required>
            <button type="submit" class="login-btn">Zaloguj się</button>
        </form>
        <a href="register.html" class="register-link">Nie masz konta? Zarejestruj się</a>
    </div>
</body>
</html>
