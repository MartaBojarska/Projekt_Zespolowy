<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koszyk - HoneyShop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f4e1;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #FFDF92;
            padding: 10px;
            display: flex;
            align-items: center;
        }
        header img {
            height: 60px;
            margin-right: 10px;
        }
        h1 {
            font-size: 24px;
            color: #2c2c2c;
        }
        .container {
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #ffee99;
        }
        .remove-btn {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }
        .remove-btn:hover {
            background-color: #c9302c;
        }
        .summary {
            margin-top: 20px;
            text-align: right;
            font-weight: bold;
        }
        .checkout-btn {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .checkout-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <header>
        <img src="HoneyShopLogo.png" alt="HoneyShop Logo">
        <h1>Twój koszyk</h1>
    </header>

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>Produkt</th>
                    <th>Cena</th>
                    <th>Ilość</th>
                    <th>Suma</th>
                    <th>Usuń</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Miód Lipowy</td>
                    <td>25.99 PLN</td>
                    <td>2</td>
                    <td>51.98 PLN</td>
                    <td><button class="remove-btn">Usuń</button></td>
                </tr>
                <tr>
                    <td>Miód Akacjowy</td>
                    <td>29.99 PLN</td>
                    <td>1</td>
                    <td>29.99 PLN</td>
                    <td><button class="remove-btn">Usuń</button></td>
                </tr>
            </tbody>
        </table>

        <div class="summary">
            Łączna kwota: 81.97 PLN
        </div>

        <div class="summary">
            <button class="checkout-btn">Przejdź do płatności</button>
        </div>
    </div>
</body>
</html>
