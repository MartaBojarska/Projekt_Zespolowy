<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koszyk - HoneyShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="./images/HoneyShopLogo.png" alt="HoneyShop Logo">
        <h1>Twój koszyk</h1>
    </header>

    <div class="content-container">
        <div class="table-responsive">
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Produkt</th>
                        <th>Cena</th>
                        <th>Ilość</th>
                        <th>Suma</th>
                        <th>Usuń</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Miód Lipowy</td>
                        <td>25.99 PLN</td>
                        <td>2</td>
                        <td>51.98 PLN</td>
                        <td><button class="remove-btn">Usuń</button></td>
                    </tr>
                    <tr>
                        <td>Miód Akacjowy</td>
                        <td>29.99 PLN</td>
                        <td>1</td>
                        <td>29.99 PLN</td>
                        <td><button class="remove-btn">Usuń</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="summary">
            Łączna kwota: 81.97 PLN
        </div>

        <div class="summary">
            <button class="checkout-btn">Przejdź do płatności</button>
        </div>
    </div>
</body>
</html>
