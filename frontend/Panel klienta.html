<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Klienta - HoneyShop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f4e1;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #FFDF92;
            padding: 10px;
            display: flex;
            align-items: center;
        }
        header img {
            height: 60px;
            margin-right: 10px;
        }
        h1 {
            font-size: 24px;
            color: #2c2c2c;
        }
        .container {
            padding: 20px;
        }
        .section {
            background-color: #fff;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .section h2 {
            margin-top: 0;
            color: #2c2c2c;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #ffee99;
        }
    </style>
</head>
<body>
    <header>
        <img src="./images/HoneyShopLogo.png" alt="HoneyShop Logo">
        <h1>Panel Klienta</h1>
    </header>

    <div class="container">

        <div class="section">
            <h2>Dane Klienta</h2>
            <p><strong>Imię:</strong> Jan</p>
            <p><strong>Nazwisko:</strong> Kowalski</p>
            <p><strong>Email:</strong> jan.kowalski@email.com</p>
            <p><strong>Adres:</strong> Ul. Miodowa 12, 00-001 Warszawa</p>
        </div>

        <div class="section">
            <h2>Historia Zamówień</h2>
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Produkty</th>
                        <th>Suma</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>2025-03-20</td>
                        <td>Miód Lipowy x2</td>
                        <td>51.98 PLN</td>
                        <td>Zrealizowane</td>
                    </tr>
                    <tr>
                        <td>2025-03-15</td>
                        <td>Miód Akacjowy x1</td>
                        <td>29.99 PLN</td>
                        <td>W realizacji</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</body>
</html>
