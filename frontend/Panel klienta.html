<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Klienta - HoneyShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="Strona glowna.html" style="display: flex; align-items: center; text-decoration: none;">
            <img src="./images/HoneyShopLogo.png" alt="HoneyShop Logo">
            <h1 style="margin: 0; color: #2c2c2c;">HoneyShop - Naturalne Miody</h1>
        </a>
        <nav class="main-nav">
            <a href="Strona glowna.html">Sklep</a>
            <a href="Koszyk.html">Koszyk</a>
            <a href="logowanie.html">Zaloguj się</a>
        </nav>
    </header>

    <div class="content-container">

            <div class="section">
                <h2>Dane Klienta</h2>
                <div id="profile-container">
                    <p>Ładowanie danych profilu...</p>
                </div>
            </div>

            <div class="section">
                <h2>Historia Zamówień</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Produkty</th>
                                <th>Suma</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="orders-list">
                            <tr>
                                <td colspan="4">Ładowanie historii zamówień...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
        <script src="main.js"></script>
    </body>
</html>
