<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoneyShop - Sklep z miodem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="./images/HoneyShopLogo.png" alt="HoneyShop Logo">
        <h1>HoneyShop - Naturalne Miody</h1>
    </header>
    <div class="content-container">
        <div class="product">
            <h2>Miód Lipowy</h2>
            <p>Cena: 25.99 PLN</p>
            <p>Dostępna ilość: 10 szt.</p>
            <button class="order-btn">Zamów</button>
        </div>
        <div class="product">
            <h2>Miód Akacjowy</h2>
            <p>Cena: 29.99 PLN</p>
            <p>Dostępna ilość: 8 szt.</p>
            <button class="order-btn">Zamów</button>
        </div>
    </div>
</body>
</html>
