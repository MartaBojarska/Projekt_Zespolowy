<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoneyShop - Sklep z miodem</title>
    <link rel="stylesheet" href="style.css">
    <script>
        function changeImage(color) {
            let tshirtImage = document.getElementById("tshirt-image");
            tshirtImage.style.opacity = 0;
            setTimeout(() => {
                tshirtImage.src = "./images/tshirt_" + color +".png";
                tshirtImage.style.opacity = 1;
            }, 300);

            document.querySelectorAll(".color-options img").forEach(img => img.classList.remove("active"));
            document.querySelector(`.color-options img[alt='${color.charAt(0).toUpperCase() + color.slice(1)}']`).classList.add("active");
        }
    </script>
</head>
<body> 
    <header>
        <a href="Strona glowna.html" style="display: flex; align-items: center; text-decoration: none;">
            <img src="./images/HoneyShopLogo.png" alt="HoneyShop Logo">
            <h1 style="margin: 0; color: #2c2c2c;">HoneyShop - Naturalne Miody</h1>
        </a>
        <nav class="main-nav">
            <a href="Strona glowna.html">Sklep</a>
            <a href="Koszyk.html">Koszyk</a>
            <a href="logowanie.html">Zaloguj się</a>
        </nav>
    </header>
    <div class="container">
        <div class="product-image">
            <img id="tshirt-image" src="./images/tshirt_white.png" alt="Biała koszulka">
        </div>
        <div class="product-details">
            <h1>Koszulka z motywem miodu</h1>
            <p>Stylowa koszulka z logiem naszej firmy. Teraz i Ty możesz zostać naszym fanem. Wybierz swój ulubiony kolor!</p>
            <div class="color-options">
                <img src="./images/tshirt_white.png" alt="Biała" onclick="changeImage('white')" class="active">
                <img src="./images/tshirt_black.png" alt="Czarna" onclick="changeImage('black')">
            </div>
            <div class="price">99 zł</div>
            <button class="btn add-to-cart-btn" data-id="koszulka">Dodaj do koszyka</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
