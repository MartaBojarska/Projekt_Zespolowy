<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoneyShop - Sklep z miodem</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f4e1;
            color: #3d3d3d;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: #FFDF92;
            padding: 10px;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            width: 100%;
        }
        header img {
            height: 60px;
            margin-right: 10px;
        }
        h1 {
            font-size: 24px;
            color: #2c2c2c;
        }
        .container {
            display: flex;
            width: 80%;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
            justify-content: center;
        }
        .product-image {
            flex: 1;
            text-align: center;
        }
        .product-image img {
            width: 80%;
            height: auto;
            border-radius: 10px;
            transition: opacity 0.3s ease-in-out;
        }
        .product-details {
            padding: 20px;
            width: 60%;
        }
        .product-details h1 {
            margin: 0;
        }
        .price {
            font-size: 22px;
            font-weight: bold;
            color: #e67e22;
            margin: 20px 0;
        }
        .btn {
            background: #e67e22;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            border-radius: 5px;
        }
        .btn:hover {
            background: #d35400;
        }
        .color-options {
            margin-top: 15px;
            display: flex;
            align-items: center;
        }
        .color-options img {
            width: 50px;
            height: 50px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
            border: 2px solid transparent;
            transition: transform 0.2s ease-in-out;
        }
        .color-options img:hover, .color-options img.active {
            border: 2px solid #e67e22;
            transform: scale(1.1);
        }
    </style>
    <script>
        function changeImage(color) {
            let tshirtImage = document.getElementById("tshirt-image");
            tshirtImage.style.opacity = 0;
            setTimeout(() => {
                tshirtImage.src = "tshirt_" + color +".png";
                tshirtImage.style.opacity = 1;
            }, 300);

            document.querySelectorAll(".color-options img").forEach(img => img.classList.remove("active"));
            document.querySelector(`.color-options img[alt='${color.charAt(0).toUpperCase() + color.slice(1)}']`).classList.add("active");
        }
    </script>
</head>
<body> 
    <header>
        <img src="HoneyShopLogo.png" alt="HoneyShop Logo">
        <h1>HoneyShop - Naturalne Miody</h1>
    </header>
    <div class="container">
        <div class="product-image">
            <img id="tshirt-image" src="tshirt_white.png" alt="Biała koszulka">
        </div>
        <div class="product-details">
            <h1>Koszulka z motywem miodu</h1>
            <p>Stylowa koszulka z logiem naszej firmy. Teraz i Ty możesz zostać naszym fanem. Wybierz swój ulubiony kolor!</p>
            <div class="color-options">
                <img src="tshirt_white.png" alt="Biała" onclick="changeImage('white')" class="active">
                <img src="tshirt_black.png" alt="Czarna" onclick="changeImage('black')">
            </div>
            <div class="price">99 zł</div>
            <button class="btn">Dodaj do koszyka</button>
        </div>
    </div>
</body>
</html>
